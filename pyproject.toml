[project]
name = "osm-wikidata-corine"
version = "0.1.0"
description = "Build a supervised text -> CORINE land-cover dataset from OSM polygons linked to Wikipedia/Wikivoyage documents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Noe Flandre" }]
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "h3>=4.1",
    "huggingface-hub>=0.26",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
owc = "osm_wikidata_corine.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-bdd>=8.1",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "ty>=0.0.1a1",
    "mutmut>=3.2",
    "radon>=6.0",
    "import-linter>=2.1",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "osm_wikidata_corine"
module-root = "src"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "N", "RUF", "ARG", "PTH", "TRY", "RET"]
ignore = ["TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs real external data (network or large local files)",
    "slow: long running",
]

[tool.coverage.run]
source = ["src/osm_wikidata_corine"]
branch = true

[tool.mutmut]
paths_to_mutate = ["src/osm_wikidata_corine/domain/"]
tests_dir = "tests/unit/"
