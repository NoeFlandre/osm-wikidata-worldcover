site_name: osm-wikidata-worldcover
site_description: A supervised text to land-cover dataset built from OSM polygons and Wikipedia articles
repo_url: https://github.com/NoeFlandre/osm-wikidata-worldcover
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features: [navigation.sections, content.code.copy]
nav:
  - Home: index.md
  - How it works: pipeline.md
  - Dataset schema: schema.md
  - Technical debt: technical-debt.md
  - Decisions:
      - ADR 0001 WorldCover over CORINE: adr/0001-worldcover-instead-of-corine.md
      - ADR 0002 Coverage relative to the polygon: adr/0002-coverage-relative-to-the-polygon.md
      - ADR 0003 Geographic splits via H3: adr/0003-geographic-splits-via-h3.md
      - ADR 0004 Streaming tiles: adr/0004-streaming-tiles.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
